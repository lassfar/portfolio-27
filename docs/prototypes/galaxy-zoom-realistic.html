<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galaxy zoom-out — realistic study</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Krona+One&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
<style>
  :root { --rich-black:#19191C; --peach:#FFA14A; --baby-blue:#2489FF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:#19191C; color:#fff; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0; z-index:0; }
  canvas { display:block; }
  #scroll { height:700vh; } /* scroll distance drives the zoom */
  #badge { position:fixed; left:22px; top:20px; z-index:5; font-family:"Krona One",sans-serif;
        font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.42); }
  #badge b { color:var(--peach); font-weight:400; }
  #stageLbl { position:fixed; left:22px; bottom:56px; z-index:5; font-family:"Great Vibes",cursive; font-size:34px; color:#fff; opacity:.9; }
  #hint { position:fixed; left:22px; bottom:22px; z-index:5; font-family:"Krona One",sans-serif; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.4); }
  #prog { position:fixed; right:20px; bottom:22px; z-index:5; font-family:"Krona One",sans-serif; font-size:10px; color:rgba(255,255,255,.5); }
  .lil-gui { --width:300px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="badge"><b>Galaxy zoom-out — realistic</b> · the website's finale timing + dot/opacity rules, with the realistic look</div>
  <div id="stageLbl">Leaving the Voyager</div>
  <div id="hint">scroll ↓ to fly out · drag to turn space · the Voyager + solar system here are simple stand-ins (the site uses the real ones)</div>
  <div id="prog">0%</div>
  <div id="scroll"></div>
<script>
(function () {
  var THREE = window.THREE;
  var stage = document.getElementById("stage");
  var W = window.innerWidth, H = window.innerHeight;
  var DPR = Math.min(window.devicePixelRatio, 2);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(DPR); renderer.setSize(W, H); renderer.setClearColor(0x19191c, 1);
  stage.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 4000);

  // ── The website's finale, mirrored 1:1 (world units) ─────────────────────────
  // Every number below is copied from src/components/three.js/… so this preview
  // behaves like the site: same camera path, same fade windows (in galaxy-beat
  // progress 0..1), same fixed-size galaxy dots.
  var SITE = {
    SUNPOS: [12, 0, -18],          // solar/config SUNPOS
    VOYAGER: [0, 0, 0],            // voyager/config VOYAGER_POS
    LAB_OFFSET: [2.6, 1.2, 3.8],   // voyager/config LAB_CAM.offset
    LAB_LOOK: [0, -0.4, 0],        // voyager/config LAB_CAM.look
    SCALE: 54,                     // galaxy/config GALAXY_SCALE
    SOLAR_R: 0.62,                 // galaxy/config GALAXY_SOLAR_R
    endDir: [0, 3.2, 19],          // GALAXY_ZOOM.endDir
    dEndLocal: 19.3,               // GALAXY_ZOOM.dEnd = Rmax · scale · 19.3/10.5
    panSunEnd: 0.44,               // GALAXY_ZOOM.panSunEnd
    voyagerFade: [0, 0.12],        // Voyager.tsx: fades out as the finale starts
    solarReturn: [0.03, 0.22],     // SOLAR.finaleReturn: the solar system fades back in
    starfieldFade: [0.2, 0.55],    // Starfield.tsx: the near background stars fade out
    galaxyReveal: [0.44, 0.82],    // GALAXY.revealStart / revealEnd
    coreGlowIn: [0.6, 0.92],       // GALAXY.coreGlowIn
    farStarsIn: [0.25, 0.6],       // GALAXY_SPACE.starsIn: far stars take over from the near starfield
    farGalaxiesIn: [0.62, 0.92],   // GALAXY_SPACE.galaxiesIn
    // The solar system flies with the galaxy — the Voyager with it (galaxy/spin.ts):
    flyFrom: 0.03,                 // GALAXY.flyFrom: it flies once it's back on screen
    flyResetBelow: 0.002           // GALAXY.flyResetBelow: reset right back at the Voyager
  };

  // ── The realistic look (from galaxy-realistic.html) ──────────────────────────
  var GAL = {
    seed: 9264,
    count: 90000, mobileScale: 0.35,
    discRadius: 10.5, discScaleLength: 3.2, discThickness: 0.30,
    bulgeRadius: 2.5, bulgeFlatten: 0.6,
    armCount: 4, pitchDeg: 18, armPhase: 0, armWidth: 2, ridgeGain: 0.6,
    clumpiness: 0.55, clumpFreq: 1.3,
    tWarm: 0.14, tBlue: 0.5,
    interArmDim: 0.45,
    hiiCount: 170, hiiOffset: 0.35, blueClusters: 120,
    dustOffset: 0.36, dustWidth: 0.11, dustBreak: 0.55, featherRate: 0.09, dustPatches: 2600,
    inclination: 74, roll: -23, spinSpeed: 0.015, differential: 0.001,
    // Dots: a FIXED size on screen, like the site (they never balloon up close).
    uSize: 1.0, twinkleAmount: 0,
    // Glow + dust have a REAL size in space, so they fade out when close to the camera
    // (below): from inside the galaxy they only show in the distance, like the Milky Way.
    glowAmount: 0.235, glowSize: 245,
    dustOpacity: 0.9, dustSize: 190,
    nearFadeStart: 0, nearFadeEnd: 7, // galaxy units: invisible closer than start, full beyond end
    knotBrightness: 1.0,
    coreOpacity: 0.2, coreScale: 3.2,
    bloomStrength: 0.55, bloomRadius: 0.5, bloomThreshold: 0.66,
    sparkleCount: 16, sparkleSize: 62, sparkleSpikes: 1.15,
    sparkleIn: [0.8, 0.95],               // the sparkly stars fade in with the full galaxy view
    highlightKnee: 0.65,                   // brightness above this rolls off softly instead of clipping
    // soft edges (the disc melts into space) + the space around it (like the site)
    outerStars: 0.04, envelope: 1, edgeSoftness: 0.7,
    showFarStars: true, farStarCount: 20000, farStarCountMobile: 8000, farStarSize: 1.0, farStarBrightness: 1.0,
    showFarGalaxies: true, farGalaxySize: 1.5, farGalaxyBrightness: 1.0,
    dragTurns: true,
    showGlow: true, showDust: true, showBloom: true, showSparkles: true,
    paused: false
  };
  if (W < 768) GAL.count = Math.round(GAL.count * GAL.mobileScale);

  // ── Palette, helpers + the ONE arm-model builder — copied verbatim from
  //    galaxy-realistic.html so the look is identical. ──────────────────────────
  var TAU = Math.PI * 2;
  var P = {
    peach:0xffa14a, lpeach:0xffe3c7, dpeach:0xef7d14, babyBlue:0x2489ff,
    lbabyBlue:0xc5e0ff, nebulaBlue:0x2563ff, coral:0xe24b4a, coreWhite:0xcfe0ff
  };
  var C = {};
  Object.keys(P).forEach(function (k) { C[k] = new THREE.Color(P[k]); });
  // Derived tones (all from the brand palette):
  var CREAM    = C.lpeach.clone().lerp(new THREE.Color(0xffffff), 0.35); // creamy core
  var PINK     = C.coral.clone().lerp(C.lpeach, 0.35);                  // coral-pink star-forming regions
  // Dust tints are TRANSMISSION colours (multiplied onto the light behind): a
  // dark-peach brown, and a redder variant.
  var DUST     = C.dpeach.clone().multiplyScalar(0.35).lerp(new THREE.Color(0.2, 0.15, 0.13), 0.5);
  var DUST_RED = C.coral.clone().multiplyScalar(0.4).lerp(new THREE.Color(0.2, 0.13, 0.12), 0.5);
  var NEUTRAL  = new THREE.Color(0.62, 0.63, 0.66);                     // old, dim inter-arm stars
  var STEEL    = new THREE.Color(0.55, 0.66, 0.85);                     // arm haze

  // ── seeded RNG + noise helpers ───────────────────────────────────────────────
  var rnd;
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function gauss(sigma){ var u=1-rnd(), v=rnd(); return sigma*Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v); }
  function smoothstep(a,b,x){ var t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }
  function unitDir(){ var u=rnd()*2-1, th=rnd()*TAU, s=Math.sqrt(1-u*u); return [s*Math.cos(th), u, s*Math.sin(th)]; }
  function hash2(ix, iy){
    var h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(GAL.seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y){
    var ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
    var ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
    var a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
    return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
  }
  function fbm(x, y){ return 0.65*vnoise(x,y) + 0.35*vnoise(x*2.1+5.3, y*2.1+1.7); }
  var _c = new THREE.Color();

  // One geometry "layer": the same attributes for every point cloud.
  function layer(){
    var L = { pos:[], col:[], scl:[], bri:[], sed:[], rn:[] };
    L.push = function(x,y,z, c, s, b, rNorm){
      L.pos.push(x,y,z); L.col.push(c.r,c.g,c.b); L.scl.push(s); L.bri.push(b);
      L.sed.push(rnd()); L.rn.push(Math.min(1, Math.max(0, rNorm)));
    };
    L.geom = function(){
      var g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(L.pos, 3));
      g.setAttribute("aColor", new THREE.Float32BufferAttribute(L.col, 3));
      g.setAttribute("aScale", new THREE.Float32BufferAttribute(L.scl, 1));
      g.setAttribute("aBright", new THREE.Float32BufferAttribute(L.bri, 1));
      g.setAttribute("aSeed", new THREE.Float32BufferAttribute(L.sed, 1));
      g.setAttribute("aRadiusNorm", new THREE.Float32BufferAttribute(L.rn, 1));
      return g;
    };
    return L;
  }

  // Young arm stars: warm near the core → baby-blue outward (as in v1).
  function armColor(rr, RMAX){
    var t = Math.min(1, rr/RMAX);
    var ts = Math.min(1, Math.max(0, t + (rnd()-0.5)*0.12));
    if (ts < GAL.tWarm) return _c.copy(C.lpeach).lerp(C.peach, smoothstep(0, GAL.tWarm, ts));
    if (ts < GAL.tBlue) return _c.copy(C.peach).lerp(C.babyBlue, smoothstep(GAL.tWarm, GAL.tBlue, ts));
    _c.copy(C.babyBlue).lerp(C.lbabyBlue, (ts-GAL.tBlue)/(1-GAL.tBlue));
    if (rnd() < 0.25) _c.lerp(C.nebulaBlue, 0.4);
    return _c;
  }

  // ── build every layer from ONE arm model, so dust, glow and pink regions sit on
  //    the same arms as the stars. Convention: +across = the arm's INNER edge (dust),
  //    −across = its OUTER edge (star-forming regions), like the reference photo. ──
  function buildAll(){
    rnd = mulberry32(GAL.seed);
    var N = GAL.count;
    var RMAX = GAL.discRadius, H0 = GAL.discScaleLength, R0 = 1.1;
    var RNORM = 1 - Math.exp(-RMAX/H0);
    var B = 1/Math.tan(GAL.pitchDeg*Math.PI/180);
    var sampleRadius = function(){ return -H0*Math.log(1 - rnd()*RNORM); };
    var hz = function(r){ return GAL.discThickness * (0.6 + 0.4*Math.exp(-r/(RMAX*0.5))); };
    var armAngle = function(r,k){ return k*(TAU/GAL.armCount) + B*Math.log(Math.max(r,R0)/R0) + GAL.armPhase; };
    // Knotty arms: noise along (and across) each arm → dense clumps + gaps.
    var clumpAccept = function(r, k, across){
      var n = fbm(r*GAL.clumpFreq + k*13.7, across*2.0 + k*7.1);
      return (1-GAL.clumpiness) + GAL.clumpiness*Math.min(1.4, smoothstep(0.28, 0.72, n)*1.4);
    };
    function base(){ return 0.82 + rnd()*0.32; }
    function jitter(){ return 0.6 + rnd()*0.8; }

    var S = layer(), K = layer(), G = layer(), D = layer();
    var i, r, k, d, phi, y, rr, c, b, s;

    // ── STARS ──
    // 1 — bulge: old, creamy, smooth, dense toward the centre
    var nBulge = Math.round(N*0.11);
    for (i=0;i<nBulge;i++){
      r = GAL.bulgeRadius * Math.pow(rnd(), 1.8); d = unitDir();
      c = _c.copy(CREAM).lerp(C.peach, Math.pow(r/GAL.bulgeRadius, 0.8)*0.7);
      b = (0.22 + 0.35*(1 - r/GAL.bulgeRadius)) * base();
      S.push(d[0]*r, d[1]*r*GAL.bulgeFlatten, d[2]*r, c, 0.35+rnd()*0.4, b, r/RMAX);
    }
    // 2 — between the arms: old, dim, neutral (NOT blue — that's the young arms)
    var nDisc = Math.round(N*0.22);
    for (i=0;i<nDisc;i++){
      r = sampleRadius(); phi = rnd()*TAU; y = gauss(hz(r));
      c = _c.copy(C.peach).lerp(C.lbabyBlue, smoothstep(0.15, 0.85, r/RMAX)).lerp(NEUTRAL, 0.35);
      b = base() * GAL.interArmDim; s = 0.45 + rnd()*0.4;
      if (rnd() < 0.02) { s *= 1.8; b *= 1.8; }
      S.push(Math.cos(phi)*r, y, Math.sin(phi)*r, c, s, b, r/RMAX);
    }
    // 3 — spiral arms: young + bright, clumpy, thinned where the dust lane sits
    var nArm = Math.round(N*0.50), got = 0, tries = 0, maxTries = nArm*4;
    while (got < nArm && tries < maxTries){
      tries++;
      r = sampleRadius(); k = Math.floor(rnd()*GAL.armCount);
      var sigmaPhi = GAL.armWidth / Math.max(r, R0);
      var dPhi = gauss(sigmaPhi), across = dPhi*r;
      if (rnd() > clumpAccept(r, k, across)) continue;
      if (across > GAL.dustOffset*0.7 && across < GAL.dustOffset*1.3 && rnd() < 0.35) continue;
      phi = armAngle(r,k) + dPhi;
      rr = Math.max(0, r + gauss(0.12*r));
      var ridge = Math.exp(-(dPhi*dPhi)/(2*Math.pow(0.45*sigmaPhi,2)));
      y = gauss(hz(rr));
      c = _c.copy(armColor(rr, RMAX));
      b = base() * (1 + GAL.ridgeGain*ridge) * (0.45 + 0.55*smoothstep(0.8, 3.2, rr)); // dimmer in the core
      s = jitter() * (1 + 0.4*ridge);
      if (rnd() < 0.08) { c.copy(C.coreWhite); b *= 1.25; }           // hot young stars
      if (rnd() < 0.03) { s *= 1.8; b *= 1.5; }                         // resolved standouts
      S.push(Math.cos(phi)*rr, y, Math.sin(phi)*rr, c, s, b, rr/RMAX);
      got++;
    }
    // 4 — faint round halo (depth)
    var nHalo = Math.round(N*0.05);
    for (i=0;i<nHalo;i++){
      r = RMAX*(0.6 + 0.7*Math.pow(rnd(),2)); d = unitDir();
      c = _c.copy(C.coreWhite).lerp(C.lbabyBlue, rnd()).lerp(NEUTRAL, 0.3);
      S.push(d[0]*r, d[1]*r*0.85, d[2]*r, c, 0.4+rnd()*0.35, base()*0.3, r/RMAX);
    }

    // ── STAR-FORMING REGIONS (their own layer, drawn ABOVE the dust) ──
    // Many small coral-pink regions on the arms' OUTER edge, each made of a few
    // sub-clumps, with a soft pink glow.
    for (i=0;i<GAL.hiiCount;i++){
      r = RMAX*(0.28 + 0.67*Math.pow(rnd(), 0.8)); k = Math.floor(rnd()*GAL.armCount);
      phi = armAngle(r,k) - (GAL.hiiOffset + gauss(0.12))/r;
      var cx = Math.cos(phi)*r, cz = Math.sin(phi)*r, cy = gauss(hz(r)*0.5);
      var regionB = 0.6 + rnd()*0.8;
      var subs = 2 + Math.floor(rnd()*3);
      for (var sc=0; sc<subs; sc++){
        var sx = cx + gauss(0.12), sz = cz + gauss(0.12);
        var dots = 5 + Math.floor(rnd()*9);
        for (var j=0;j<dots;j++){
          c = _c.copy(PINK).lerp(C.coral, rnd()*0.5);
          b = base()*1.6*regionB;
          if (rnd() < 0.15) { c.copy(C.coreWhite).lerp(PINK, 0.3); b *= 1.3; } // white-hot cores
          K.push(sx+gauss(0.045), cy+gauss(0.03), sz+gauss(0.045), c, jitter()*1.4, b, r/RMAX);
        }
      }
      G.push(cx, cy, cz, PINK, 0.9 + rnd()*0.6, 0.9*regionB, r/RMAX);
    }
    // Young blue clusters sitting ON the arm ridge.
    for (i=0;i<GAL.blueClusters;i++){
      r = RMAX*(0.3 + 0.65*rnd()); k = Math.floor(rnd()*GAL.armCount);
      phi = armAngle(r,k) + gauss(0.2)/r;
      var bx = Math.cos(phi)*r, bz = Math.sin(phi)*r, by = gauss(hz(r)*0.5);
      var nd = 6 + Math.floor(rnd()*7);
      for (var q=0;q<nd;q++){
        c = _c.copy(C.lbabyBlue).lerp(C.coreWhite, rnd()*0.6);
        K.push(bx+gauss(0.05), by+gauss(0.03), bz+gauss(0.05), c, jitter()*1.1, base()*1.3, r/RMAX);
      }
      G.push(bx, by, bz, C.lbabyBlue, 0.7 + rnd()*0.4, 0.45, r/RMAX);
    }

    // ── SOFT GLOW (the milky light of stars too small to see one by one) ──
    for (i=0;i<700;i++){                                   // core glow (faint: hundreds overlap here)
      r = GAL.bulgeRadius*1.3*Math.pow(rnd(), 1.4); d = unitDir();
      c = _c.copy(CREAM).lerp(C.peach, r/(GAL.bulgeRadius*1.3)*0.6);
      G.push(d[0]*r, d[1]*r*GAL.bulgeFlatten, d[2]*r, c, 1.6+rnd()*2.2, 0.012, r/RMAX);
    }
    var gArm = 0, gTries = 0;
    while (gArm < 5200 && gTries < 20000){                // arm glow
      gTries++;
      r = sampleRadius(); k = Math.floor(rnd()*GAL.armCount);
      var gs = GAL.armWidth*1.25/Math.max(r, R0), gdp = gauss(gs);
      if (rnd() > clumpAccept(r, k, gdp*r)) continue;
      phi = armAngle(r,k) + gdp;
      var gridge = Math.exp(-(gdp*gdp)/(2*gs*gs));
      c = _c.copy(armColor(r, RMAX)).lerp(STEEL, 0.35);
      G.push(Math.cos(phi)*r, gauss(hz(r)), Math.sin(phi)*r, c, 1.0+rnd()*1.3, 0.4*(0.6+0.4*gridge)*(0.12 + 0.88*smoothstep(1.2, 4.0, r)), r/RMAX);
      gArm++;
    }
    for (i=0;i<1600;i++){                                  // faint disc glow
      r = sampleRadius(); phi = rnd()*TAU;
      c = _c.copy(C.peach).lerp(STEEL, smoothstep(0.1, 0.8, r/RMAX)).lerp(NEUTRAL, 0.4);
      G.push(Math.cos(phi)*r, gauss(hz(r)), Math.sin(phi)*r, c, 1.8+rnd()*1.8, 0.16*smoothstep(1.0, 3.5, r), r/RMAX);
    }

    // ── DUST (drawn with normal blending, so it DARKENS what's behind it) ──
    // A filament along each arm's inner edge, broken up by noise, with short
    // "feathers" crossing the arm, plus patchy dust across the disc.
    for (k=0;k<GAL.armCount;k++){
      for (r = 1.0; r < RMAX*0.97; r += 0.022){
        var n = fbm(r*1.6 + k*9.1, k*3.3 + 0.5);
        if (n < GAL.dustBreak) continue;                   // gaps in the lane
        var strength = smoothstep(GAL.dustBreak, GAL.dustBreak + 0.25, n);
        var outer = 1 - smoothstep(0.8*RMAX, 0.97*RMAX, r);
        var laneOff = GAL.dustOffset*(0.75 + 0.5*vnoise(r*2.4 + k*5.0, 11.3)); // wandering lane
        var inner = 0.55 + 0.45*smoothstep(1.0, 2.2, r);   // lighter over the bright core
        var puffs = 3 + Math.floor(rnd()*3);
        for (var p=0;p<puffs;p++){
          var ac = laneOff + gauss(GAL.dustWidth);
          rr = r + gauss(0.03);
          phi = armAngle(rr,k) + ac/rr;
          c = _c.copy(DUST).lerp(DUST_RED, rnd()*0.4);
          D.push(Math.cos(phi)*rr, gauss(hz(rr)*0.4), Math.sin(phi)*rr, c, 0.4+rnd()*0.6,
                 strength*outer*inner*(0.25 + 0.75*rnd()*rnd()), rr/RMAX);
        }
        if (rnd() < 0.35){                                  // a faint second strand
          var ac2 = laneOff + 0.2 + gauss(0.05); rr = r + gauss(0.03);
          phi = armAngle(rr,k) + ac2/rr;
          c = _c.copy(DUST).lerp(DUST_RED, rnd()*0.4);
          D.push(Math.cos(phi)*rr, gauss(hz(rr)*0.4), Math.sin(phi)*rr, c, 0.35+rnd()*0.4,
                 strength*outer*inner*0.45*rnd(), rr/RMAX);
        }
        if (r > 1.2 && rnd() < GAL.featherRate){           // a feather crossing the arm
          var phiL = armAngle(r,k) + laneOff/r;
          var px0 = Math.cos(phiL)*r, pz0 = Math.sin(phiL)*r;

  fNear.add(GAL,"nearFadeEnd",0.5,20,0.1).name("full beyond").onChange(applyLive);
  var fSpark = gui.addFolder("Sparkly stars");
  fSpark.add(GAL,"sparkleCount",0,16,1).name("count").onFinishChange(buildSparkles);
  fSpark.add(GAL,"sparkleSize",20,140,1).name("size").onChange(applyLive);
  fSpark.add(GAL,"sparkleSpikes",0,1.5,0.05).name("sparkle").onChange(applyLive);
  fSpark.close();
  var fSpace = gui.addFolder("Space around it");
  fSpace.add(GAL,"showFarStars").name("far stars").onChange(applyLive);
  fSpace.add(GAL,"farStarBrightness",0,3,0.05).name("far stars brightness").onChange(applyLive);
  fSpace.add(GAL,"farStarSize",0.5,3,0.05).name("far stars size (px)").onChange(applyLive);
  fSpace.add(GAL,"farStarCount",0,40000,1000).name("far stars count").onFinishChange(buildFarStars);
  fSpace.add(GAL,"showFarGalaxies").name("distant galaxies").onChange(applyLive);
  fSpace.add(GAL,"farGalaxyBrightness",0,3,0.05).name("distant galaxies brightness").onChange(applyLive);
  fSpace.add(GAL,"farGalaxySize",0.3,3,0.05).name("distant galaxies size").onChange(applyLive);
  fSpace.add(GAL,"dragTurns").name("drag turns the galaxy");
  fSpace.add(GAL,"edgeSoftness",0,1,0.01).name("soft edges").onChange(applyLive);
  fSpace.add(GAL,"envelope",0,3,0.05).name("outer glow").onFinishChange(rebuild);
  fSpace.add(GAL,"outerStars",0,0.15,0.005).name("outer stars").onFinishChange(rebuild);
  fSpace.close();
  var fShape = gui.addFolder("Shape (rebuilds)");
  fShape.add(GAL,"count",10000,150000,5000).onFinishChange(rebuild);
  fShape.add(GAL,"pitchDeg",8,35,1).name("armTightness").onFinishChange(rebuild);
  fShape.add(GAL,"armWidth",0.4,2.0,0.05).onFinishChange(rebuild);
  fShape.add(GAL,"clumpiness",0,1,0.05).name("knotty arms").onFinishChange(rebuild);
  fShape.add(GAL,"hiiCount",0,400,10).name("pink regions count").onFinishChange(rebuild);
  fShape.add(GAL,"dustBreak",0,0.8,0.01).name("dust gaps").onFinishChange(rebuild);
  fShape.add(GAL,"featherRate",0,0.2,0.005).name("dust feathers").onFinishChange(rebuild);
  fShape.add(GAL,"spinSpeed",0,0.3,0.005).name("spin speed");
  fShape.add(GAL,"paused");
  fShape.close();

  // ── loop ─────────────────────────────────────────────────────────────────────
  var clock = new THREE.Clock();
  window.addEventListener("resize", function(){
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W/H; camera.updateProjectionMatrix();
    renderer.setSize(W, H); composer.setSize(W, H);
    buildSparkles();
  });
  (function render(){
    requestAnimationFrame(render);
    var dt = clock.getDelta(), t = clock.getElapsedTime(), z = prog;
    U.uTime.value = t;

    // spin + the solar system's flight (same rules as the site) — the Voyager with it
    if (!GAL.paused) galaxySpin.rotation.y += GAL.spinSpeed * dt;
    if (z < SITE.flyResetBelow) fly.a = 0;
    else if (z >= SITE.flyFrom && !GAL.paused) fly.a += GAL.spinSpeed * dt;
    solarSys.position.copy(flyingSun());
    voyager.position.copy(flyOffset());

    // drag: the whole scene turns (planets, near stars); the galaxy + its sky turn by
    // the part made since they came on screen, about the Sun (it stays in its arm)
    if (!GAL.dragTurns) drag.target = drag.yaw = 0;
    drag.yaw += (drag.target - drag.yaw)*0.03;
    if (z < SPACE_FROM) dragBase = drag.yaw;
    qScene.setFromAxisAngle(Y_AXIS, drag.yaw);
    qDrag.setFromAxisAngle(Y_AXIS, drag.yaw - dragBase);
    solarSys.quaternion.copy(qScene);
    starfield.quaternion.copy(qScene);
    var sunP = flyingSun();
    gcLive.copy(GC).sub(sunP).applyQuaternion(qDrag).add(sunP);
    galaxyRoot.position.copy(gcLive);
    galaxyRoot.quaternion.copy(qDrag);

    // fades — the site's windows
    var gRev = easeOutCubic(remap01(z, SITE.galaxyReveal[0], SITE.galaxyReveal[1]));
    U.uReveal.value = gRev; galaxyRoot.visible = gRev > 0.001;
    coreUniforms.uOpacity.value = GAL.coreOpacity * remap01(z, SITE.coreGlowIn[0], SITE.coreGlowIn[1]);
    var sRev = easeOutCubic(remap01(z, SITE.solarReturn[0], SITE.solarReturn[1]));
    solarReveal.value = sRev; solarSys.visible = sRev > 0.001;
    ringMats.forEach(function(m){ m.opacity = 0.16 * sRev; });
    sunGlowU.uOpacity.value = 0.45 * sRev;
    voyagerReveal.value = 1 - remap01(z, SITE.voyagerFade[0], SITE.voyagerFade[1]);
    voyager.visible = voyagerReveal.value > 0.001;
    starfieldU.uReveal.value = 1 - remap01(z, SITE.starfieldFade[0], SITE.starfieldFade[1]);
    sparkleU.uFade.value = GAL.showSparkles ? remap01(z, GAL.sparkleIn[0], GAL.sparkleIn[1]) : 0;
    sparklePts.visible = sparkleU.uFade.value > 0.001;
    farStarU.uFade.value = GAL.showFarStars ? remap01(z, SITE.farStarsIn[0], SITE.farStarsIn[1]) : 0;
    farStarPts.visible = farStarU.uFade.value > 0.001;
    farGalU.uFade.value = GAL.showFarGalaxies ? remap01(z, SITE.farGalaxiesIn[0], SITE.farGalaxiesIn[1]) : 0;
    farGalPts.visible = farGalU.uFade.value > 0.001;

    updateCamera(z, gcLive);
    starfield.position.copy(camera.position);                    // pinned, like the site
    sky.position.copy(camera.position);                          // the sky: pinned + turned
    sky.quaternion.copy(qDrag).multiply(SKY_END);
    // billboards (undoing the turn their parent carries)
    coreGlow.quaternion.copy(qInv.copy(qDrag).invert()).multiply(camera.quaternion);
    solarSys.userData.glow.quaternion.copy(qInv.copy(qScene).invert()).multiply(camera.quaternion);

    composer.render();
  })();
})();
</script>
