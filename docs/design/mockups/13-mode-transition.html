<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mode transition — sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Krona+One&display=swap" rel="stylesheet" />
<style>
  :root { --rich-black:#19191C; --peach:#FFA14A; --light-peach:#FFE3C7; --gray-slate:#D9D9D9; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--rich-black); color:#fff; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; overflow:hidden; }
  .stage { position:fixed; inset:0; overflow:hidden; }
  .stage img { position:absolute; inset:-4%; width:108%; height:108%; object-fit:cover; }
  /* Story mode: a slow drift stands in for the living 3D. Calm mode: still. */
  .stage.story img { animation:drift 14s ease-in-out infinite alternate; }
  @keyframes drift { from { transform:scale(1) translate(0,0); } to { transform:scale(1.06) translate(-1.5%,1%); } }
  .mode { position:fixed; left:22px; bottom:20px; z-index:5; font-family:"Krona One",sans-serif; font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:rgba(255,255,255,0.55); }
  .mode b { color:var(--peach); font-weight:400; }
  /* The switch (as in the calm sketch). */
  .switch { position:fixed; top:20px; right:22px; z-index:20; width:42px; height:42px; border-radius:999px; border:0; cursor:pointer; display:grid; place-items:center; color:var(--light-peach);
    background:rgba(25,25,28,0.55); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.10), 0 8px 24px -10px rgba(0,0,0,0.6); backdrop-filter:blur(12px) saturate(1.5); -webkit-backdrop-filter:blur(12px) saturate(1.5); }
  .switch:hover, .switch:focus-visible { box-shadow:inset 0 0 0 1px rgba(255,161,74,0.55), 0 0 26px -4px rgba(255,161,74,0.45); outline:none; }
  .switch[aria-pressed="true"] { color:var(--peach); }
  .switch svg { width:18px; height:18px; }
  /* The concept picker (the sketch's own control). */
  .picker { position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:20; display:flex; gap:4px; padding:4px; border-radius:999px; background:rgba(25,25,28,0.75); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08); }
  .picker button { border:0; border-radius:999px; padding:8px 14px; background:transparent; color:rgba(255,255,255,0.6); font-family:"Krona One",sans-serif; font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; cursor:pointer; }
  .picker button[aria-pressed="true"] { background:rgba(255,161,74,0.14); color:var(--peach); box-shadow:inset 0 0 0 1px rgba(255,161,74,0.45); }
  .hint { position:fixed; right:22px; bottom:20px; z-index:5; font-size:12px; color:rgba(255,255,255,0.45); }
  /* The transition screen. */
  .veil { position:fixed; inset:0; z-index:15; background:var(--rich-black); display:grid; place-items:center; opacity:0; pointer-events:none; transition:opacity var(--fade, 400ms) ease; }
  .veil.on { opacity:1; pointer-events:auto; }
  .card { display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; }
  .line { font-family:"Great Vibes",cursive; font-size:clamp(36px, 5vw, 58px); color:#fff; line-height:1.1; }
  .line em { font-style:normal; color:var(--peach); }
  .eyebrow { font-family:"Krona One",sans-serif; font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.5); }
  svg.sky { width:min(640px, 86vw); height:auto; overflow:visible; }
  .sky .link { fill:none; stroke:rgba(255,161,74,0.55); stroke-width:1.2; stroke-linecap:round; }
  .sky .star { fill:rgba(217,217,217,0.45); }
  .sky .star.passed { fill:rgba(255,161,74,0.8); }
  .sky .star.here { fill:var(--peach); filter:drop-shadow(0 0 8px rgba(255,161,74,0.8)); }
  .sky text { font-family:"Krona One",sans-serif; font-size:9px; letter-spacing:1.6px; text-transform:uppercase; fill:rgba(255,227,199,0.85); }
</style>
</head>

<div class="mode" id="mode">Mode: <b>story</b> (the 3D moves) · chapter: The Earth</div>

<div class="picker" role="group" aria-label="Concept">
  <button type="button" data-concept="where" aria-pressed="true">Where you are</button>
  <button type="button" data-concept="breath" aria-pressed="false">A quiet breath</button>
</div>

<button class="switch" id="switch" type="button" aria-pressed="false" aria-label="Reduce motion">
  <svg id="icon-calm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none"><path d="M4 8h16M4 12h16M4 16h16"/></svg>
  <svg id="icon-motion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8c3-3 6 3 9 0s6 3 9 0M3 12c3-3 6 3 9 0s6 3 9 0M3 16c3-3 6 3 9 0s6 3 9 0"/></svg>
</button>
<div class="hint">Press the switch (top-right) to change mode · lines are drafts</div>

<div class="veil" id="veil" role="status" aria-live="polite"><div class="card" id="card"></div></div>

<script>
  const CHAPTERS = ["Origin","The Maker","The Craft","The Voyage","The Earth","The Lab","The Way Out","The Milky Way","Contact"];
  const HERE = 4; // the Earth
  const POINTS = [[30,150],[100,112],[170,138],[245,86],[320,108],[395,62],[470,96],[545,128],[610,74]];
  const STAR = (x, y, r) => `M${x} ${y-r} L${x+r*0.28} ${y-r*0.28} L${x+r} ${y} L${x+r*0.28} ${y+r*0.28} L${x} ${y+r} L${x-r*0.28} ${y+r*0.28} L${x-r} ${y} L${x-r*0.28} ${y-r*0.28} Z`;
  let concept = "where", calm = false, busy = false;

  function whereYouAre(toCalm) {
    const links = POINTS.slice(0, HERE + 1).map((p, i) => i ? `<path class="link" d="M${POINTS[i-1][0]} ${POINTS[i-1][1]} L${p[0]} ${p[1]}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${toCalm ? 0 : 1}" style="transition:stroke-dashoffset 260ms ease ${i * 120}ms"/>` : "").join("");
    const stars = POINTS.map((p, i) => `<path class="star ${i < HERE ? "passed" : ""} ${i === HERE ? "here" : ""}" d="${STAR(p[0], p[1], i === HERE ? 11 : 6)}"/>`).join("");
    const label = `<text x="${POINTS[HERE][0]}" y="${POINTS[HERE][1] + 34}" text-anchor="middle">${CHAPTERS[HERE]}</text>`;
    return `<svg class="sky" viewBox="0 0 640 200" aria-hidden="true">${links}${stars}${label}</svg>
      <div class="line">${toCalm ? "Same story, <em>quieter</em>." : "Back to the <em>whole journey</em>."}</div>
      <div class="eyebrow">Chapter ${HERE + 1} of 9 · ${toCalm ? "calm motion" : "story mode"}</div>`;
  }
  function quietBreath(toCalm) {
    return `<div class="eyebrow">${CHAPTERS[HERE]}</div>
      <div class="line">${toCalm ? "Slowing down. <em>Same story.</em>" : "Back in <em>motion</em>."}</div>`;
  }

  function switchMode() {
    if (busy) return;
    busy = true;
    const toCalm = !calm;
    const veil = document.getElementById("veil"), card = document.getElementById("card");
    card.innerHTML = concept === "where" ? whereYouAre(toCalm) : quietBreath(toCalm);
    veil.style.setProperty("--fade", toCalm ? "500ms" : "400ms");
    veil.classList.add("on");
    // Behind the screen: the real swap (rebuild the scroll, land on the same chapter, the 3D settles).
    setTimeout(() => {
      calm = toCalm;
      document.getElementById("stage").classList.toggle("story", !calm);
      document.getElementById("mode").innerHTML = `Mode: <b>${calm ? "calm" : "story"}</b> ${calm ? "(still views)" : "(the 3D moves)"} · chapter: The Earth`;
      const sw = document.getElementById("switch");
      sw.setAttribute("aria-pressed", String(calm));
      document.getElementById("icon-calm").style.display = calm ? "" : "none";
      document.getElementById("icon-motion").style.display = calm ? "none" : "";
      // Back to the story: the lines draw between the stars up to the current one (the only motion).
      if (!toCalm) card.querySelectorAll(".link").forEach((l) => { l.style.strokeDashoffset = "0"; });
    }, toCalm ? 550 : 450);
    setTimeout(() => { veil.classList.remove("on"); }, toCalm ? 1900 : 2100);
    setTimeout(() => { busy = false; }, 2600);
  }

  document.getElementById("switch").addEventListener("click", switchMode);
  document.querySelectorAll(".picker button").forEach((b) => b.addEventListener("click", () => {
    concept = b.dataset.concept;
    document.querySelectorAll(".picker button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  }));
</script>
</body>
</html>
